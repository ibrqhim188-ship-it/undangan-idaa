<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Undangan spesial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFF0F4;
    --paper: #FFFBFC;
    --ink: #4E2536;
    --muted: #86506A;
    --line: #F0C6D2;
    --rose: #C94A6E;
    --rose-ink: #FFFFFF;
    --rose-soft: #F9D3DE;
    --script: "Caveat", "Segoe Print", "Bradley Hand", cursive;
    --text: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
    color-scheme: light;

    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #2B1520;
      --paper: #3B1F2E;
      --ink: #FFE8EF;
      --muted: #E5B8C7;
      --line: #6B3A4E;
      --rose: #F08AA6;
      --rose-ink: #2B1520;
      --rose-soft: #5A2D42;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #2B1520;
    --paper: #3B1F2E;
    --ink: #FFE8EF;
    --muted: #E5B8C7;
    --line: #6B3A4E;
    --rose: #F08AA6;
    --rose-ink: #2B1520;
    --rose-soft: #5A2D42;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--text);
    font-weight: 500;
    font-size: 1.05rem;
    line-height: 1.5;
    display: grid;
    place-items: center;
    text-align: center;
    overflow-x: hidden;
  }
  #app { width: 100%; max-width: 25rem; padding: 1.25rem 1rem 2rem; }
  .screen[hidden] { display: none !important; }
  [tabindex="-1"]:focus { outline: none; }

  @media (prefers-reduced-motion: no-preference) {
    .screen { animation: rise 0.4s ease-out; }
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .script { font-family: var(--script); font-weight: 700; line-height: 1.1; margin: 0; }
  h2.script { font-size: 2.4rem; margin: 0.25rem 0 0.5rem; }
  .kecil { margin: 0; font-size: 0.95rem; color: var(--muted); }

  .card {
    background: var(--paper);
    border-radius: 1.5rem;
    border-top: 6px solid var(--rose);
    padding: 1.5rem 1.25rem 1.75rem;
    box-shadow: 0 10px 30px rgba(120, 40, 70, 0.14);
  }

  /* ---------- Amplop ---------- */
  .env {
    display: block;
    width: min(20rem, 88%);
    margin: 2rem auto 1.25rem;
    padding: 0;
    background: none;
    border: 0;
    cursor: pointer;
    border-radius: 1rem;
    -webkit-tap-highlight-color: transparent;
  }
  .env:focus-visible { outline: 3px solid var(--rose); outline-offset: 6px; }
  .env svg { width: 100%; height: auto; overflow: visible; display: block; }
  .env .letter { fill: var(--paper); stroke: var(--line); stroke-width: 2; transition: transform 0.6s cubic-bezier(0.3, 1.2, 0.5, 1) 0.25s; }
  .env .body { fill: var(--paper); stroke: var(--line); stroke-width: 2; }
  .env .flap { fill: var(--rose-soft); stroke: var(--line); stroke-width: 2; stroke-linejoin: round; transform-origin: 150px 40px; transition: transform 0.5s ease-in, opacity 0.25s ease 0.3s; }
  .env .seal circle { fill: var(--rose); }
  .env .seal path { fill: var(--rose-ink); }
  .env .seal { transform-origin: 150px 122px; transition: transform 0.3s, opacity 0.3s; }
  .env.open .flap { transform: scaleY(-1); opacity: 0; }
  .env.open .letter { transform: translateY(-95px); }
  .env.open .seal { transform: scale(0.2); opacity: 0; }
  @media (prefers-reduced-motion: no-preference) {
    .env:not(.open) .seal { animation: beat 1.6s ease-in-out infinite; }
  }
  @keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.14); } }
  .tap { font-family: var(--script); font-size: 2rem; font-weight: 700; line-height: 1.1; margin: 0.5rem 0 0.25rem; }

  /* ---------- Bunga ---------- */
  .bloom { position: fixed; inset: 0; z-index: 50; pointer-events: none; overflow: hidden; visibility: hidden; }
  .bloom.on { visibility: visible; }
  .bloom::before { content: ""; position: absolute; inset: 0; background: var(--bg); opacity: 0; transition: opacity 0.6s; }
  .bloom.cover::before { opacity: 1; }
  .bloom.out { opacity: 0; transition: opacity 0.7s; }
  .fl {
    position: absolute;
    transform: translate(-50%, -50%) scale(0) rotate(var(--r, 0deg));
    animation: bloom 0.55s cubic-bezier(0.2, 1.4, 0.4, 1) forwards;
  }
  @keyframes bloom { to { transform: translate(-50%, -50%) scale(1) rotate(calc(var(--r, 0deg) + 25deg)); } }
  .petals { fill: currentColor; stroke: rgba(255, 255, 255, 0.65); stroke-width: 1.5; }
  .core { fill: #F3C65B; }
  .fall { position: fixed; top: -60px; z-index: 40; pointer-events: none; animation: fall linear forwards; }
  .fall svg { display: block; width: 100%; height: auto; }
  @keyframes fall { to { transform: translate(var(--dx, 0), 118vh) rotate(360deg); } }

  /* ---------- Kartu ajakan ---------- */
  .foto {
    width: 9.5rem;
    aspect-ratio: 4 / 5;
    margin: 1rem auto 1.25rem;
    border: 6px solid var(--paper);
    border-radius: 1rem;
    outline: 1px solid var(--line);
    background: var(--rose-soft);
    transform: rotate(-2deg);
    overflow: hidden;
    display: grid;
    place-items: center;
  }
  .foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .foto svg { width: 55%; height: auto; fill: var(--rose); }

  .choices { margin-top: 1.25rem; min-height: 6rem; display: flex; justify-content: center; align-items: center; gap: 1.25rem; }
  .slot { display: inline-block; }
  .btn {
    font-family: var(--script);
    font-weight: 700;
    font-size: 1.6rem;
    line-height: 1.1;
    background: var(--rose);
    color: var(--rose-ink);
    border: 0;
    border-radius: 999px;
    padding: 0.6rem 2.2rem;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    text-decoration: none;
    display: inline-block;
  }
  .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .btn.block { display: block; width: 100%; margin-top: 1.25rem; }
  .btn[disabled] { opacity: 0.45; cursor: not-allowed; }
  .btn.plain { background: transparent; color: var(--muted); border: 1.5px solid var(--line); font-family: var(--text); font-size: 1rem; padding: 0.55rem 1.4rem; }
  .yes { transition: transform 0.25s cubic-bezier(0.3, 1.5, 0.5, 1); }
  .no {
    position: relative;
    z-index: 5;
    font-family: var(--text);
    font-size: 1.05rem;
    background: transparent;
    color: var(--muted);
    border: 2px solid var(--line);
    padding: 0.5rem 1.4rem;
    touch-action: none;
    transition: transform 0.3s cubic-bezier(0.3, 1.35, 0.5, 1);
  }
  .hint { margin: 0.25rem auto 0; min-height: 3.2em; max-width: 19rem; color: var(--muted); font-size: 0.95rem; }

  /* ---------- Form ---------- */
  .field { display: block; text-align: left; margin: 1rem 0 0; }
  .lbl { display: block; font-weight: 700; font-size: 0.95rem; color: var(--muted); margin-bottom: 0.35rem; }
  select, input[type="time"], input[type="text"], textarea {
    width: 100%;
    font: 500 1rem var(--text);
    padding: 0.7rem 0.85rem;
    border: 1.5px solid var(--line);
    border-radius: 0.9rem;
    background: var(--paper);
    color: var(--ink);
  }
  select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--rose); outline-offset: 1px; }
  textarea { min-height: 7.5rem; resize: vertical; margin-top: 0.75rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .chip {
    font: 700 1rem var(--text);
    padding: 0.5rem 1.05rem;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
  }
  .chip:focus-visible, .act:focus-visible { outline: 3px solid var(--rose); outline-offset: 2px; }
  .chip[aria-checked="true"], .act[aria-pressed="true"] { background: var(--rose); border-color: var(--rose); color: var(--rose-ink); }
  .acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; margin-top: 1rem; }
  .act {
    font: 700 0.78rem/1.2 var(--text);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.3rem;
    min-height: 4.6rem;
    padding: 0.5rem 0.2rem;
    border-radius: 1rem;
    border: 1.5px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
  }
  .act .em { font-size: 1.4rem; line-height: 1; }
  .own { display: flex; gap: 0.5rem; margin-top: 1rem; }
  .own input { flex: 1; min-width: 0; }
  .own .chip { background: var(--rose); border-color: var(--rose); color: var(--rose-ink); }

  /* ---------- Tiket ---------- */
  #s-ticket h2.script { margin-top: 0.5rem; }
  .ticket {
    margin: 1.25rem 0 1rem;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 1.25rem;
    padding: 1.25rem 1.25rem 1.1rem;
    text-align: left;
    box-shadow: 0 10px 30px rgba(120, 40, 70, 0.14);
  }
  .ticket .top { display: flex; justify-content: space-between; align-items: center; }
  .ticket h3 { font-family: var(--script); font-size: 2.3rem; line-height: 1; margin: 0.1rem 0 0; }
  .badge { width: 2.6rem; height: 2.6rem; border-radius: 50%; border: 1.5px dashed var(--rose); display: grid; place-items: center; }
  .badge svg { width: 1.1rem; fill: var(--rose); }
  .perf { border: 0; border-top: 2px dashed var(--line); margin: 0.9rem 0; }
  .row { display: flex; gap: 0.75rem; margin: 0.8rem 0; }
  .ico { flex: none; width: 2.3rem; height: 2.3rem; border-radius: 50%; background: var(--rose-soft); display: grid; place-items: center; }
  .ico svg { width: 1.1rem; height: 1.1rem; stroke: var(--rose); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .k { font-size: 0.82rem; color: var(--muted); line-height: 1.2; }
  .v { font-family: var(--script); font-size: 1.5rem; font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; }
  .ticket .foot { margin: 0; text-align: center; }
  .ticket .foot .script { font-size: 1.5rem; }
  .actions { display: flex; flex-direction: column; align-items: center; gap: 0.75rem; }
  .small { color: var(--muted); font-size: 0.95rem; margin: 0; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="fl" viewBox="-50 -50 100 100">
      <g class="petals">
        <ellipse cx="0" cy="-25" rx="15" ry="24"/>
        <ellipse cx="0" cy="-25" rx="15" ry="24" transform="rotate(72)"/>
        <ellipse cx="0" cy="-25" rx="15" ry="24" transform="rotate(144)"/>
        <ellipse cx="0" cy="-25" rx="15" ry="24" transform="rotate(216)"/>
        <ellipse cx="0" cy="-25" rx="15" ry="24" transform="rotate(288)"/>
      </g>
      <circle r="11" class="core"/>
    </symbol>
    <symbol id="heart" viewBox="0 0 24 24">
      <path d="M12 21C5 15.5 2 12 2 8.2A5.2 5.2 0 0 1 12 6a5.2 5.2 0 0 1 10 2.2C22 12 19 15.5 12 21z"/>
    </symbol>
  </defs>
</svg>

<div class="bloom" id="bloom" aria-hidden="true"></div>

<main id="app">

  <!-- 1. Amplop -->
  <section class="screen" id="s-envelope">
    <p class="kecil" id="env-for"></p>
    <button class="env" id="env" type="button" aria-label="Buka undangan">
      <svg viewBox="0 -70 300 280" aria-hidden="true">
        <rect class="letter" x="30" y="48" width="240" height="150" rx="10"/>
        <rect class="body" x="0" y="40" width="300" height="170" rx="14"/>
        <path class="flap" d="M0 40 H300 L150 142 Z"/>
        <g class="seal">
          <circle cx="150" cy="122" r="22"/>
          <path d="M150 133c-9-7-14-11-14-17a7 7 0 0 1 14-3 7 7 0 0 1 14 3c0 6-5 10-14 17z"/>
        </g>
      </svg>
    </button>
    <p class="tap">Ada sesuatu buat kamu</p>
    <p class="kecil">Buka dulu dong amplopnya</p>
  </section>

  <!-- 2. Ajakan -->
  <section class="screen card" id="s-ask" hidden>
    <div class="foto" id="foto"></div>
    <h2 class="script" tabindex="-1" data-focus>Main bareng aku yuk?</h2>
    <p class="kecil" id="ask-from"></p>
    <div class="choices" id="choices">
      <button class="btn yes" id="yes" type="button">Iya</button>
      <span class="slot" id="slot"><button class="btn no" id="no" type="button">Tidak</button></span>
    </div>
    <p class="hint" id="hint" aria-live="polite"></p>
  </section>

  <!-- 3. Kapan -->
  <section class="screen card" id="s-when" hidden>
    <p class="kecil" id="when-for"></p>
    <h2 class="script" tabindex="-1" data-focus>Kapan kamu free?</h2>
    <label class="field"><span class="lbl">Tanggal</span><select id="tgl"></select></label>
    <div class="field">
      <span class="lbl" id="lbl-waktu">Waktu</span>
      <div class="chips" role="radiogroup" aria-labelledby="lbl-waktu" id="periode"></div>
    </div>
    <label class="field"><span class="lbl">Jam</span><input type="time" id="jam" value="15:00"></label>
    <button class="btn block" id="when-next" type="button">Lanjut</button>
  </section>

  <!-- 4. Ngapain -->
  <section class="screen card" id="s-what" hidden>
    <h2 class="script" tabindex="-1" data-focus>Nanti kita ngapain?</h2>
    <p class="kecil">Boleh pilih lebih dari satu</p>
    <div class="acts" id="acts"></div>
    <div class="own">
      <input type="text" id="own" maxlength="30" placeholder="atau tulis idemu sendiri" aria-label="Tulis idemu sendiri">
      <button class="chip" id="own-add" type="button">Oke</button>
    </div>
    <button class="btn block" id="what-next" type="button" disabled>Lanjut</button>
  </section>

  <!-- 5. Pesan -->
  <section class="screen card" id="s-msg" hidden>
    <h2 class="script" tabindex="-1" data-focus id="msg-title"></h2>
    <label class="field" style="margin-top:0">
      <span class="lbl">Pesanmu</span>
      <textarea id="pesan" maxlength="140" placeholder="contoh: jangan telat ya"></textarea>
    </label>
    <button class="btn block" id="msg-next" type="button">Bikin tiketnya</button>
  </section>

  <!-- 6. Tiket -->
  <section class="screen" id="s-ticket" hidden>
    <h2 class="script" tabindex="-1" data-focus>Yeay, jadi!</h2>
    <p class="kecil">Tiketnya ada di bawah, simpan ya</p>

    <article class="ticket" id="ticket">
      <div class="top">
        <div>
          <span class="k">Untuk berdua</span>
          <h3>Tiket kencan</h3>
        </div>
        <div class="badge" aria-hidden="true"><svg><use href="#heart"/></svg></div>
      </div>
      <hr class="perf">
      <div class="row">
        <div class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></div>
        <div><div class="k">Untuk</div><div class="v" id="t-untuk"></div></div>
      </div>
      <div class="row">
        <div class="ico"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></div>
        <div><div class="k">Kapan</div><div class="v" id="t-kapan"></div></div>
      </div>
      <div class="row">
        <div class="ico"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg></div>
        <div><div class="k">Acara</div><div class="v" id="t-acara"></div></div>
      </div>
      <div class="row">
        <div class="ico"><svg viewBox="0 0 24 24"><path d="M12 7a2 2 0 1 0-2-2M12 7v2l9 6a1.5 1.5 0 0 1-.8 2.7H3.8A1.5 1.5 0 0 1 3 15l9-6"/></svg></div>
        <div><div class="k">Dress code</div><div class="v" id="t-dress"></div></div>
      </div>
      <div class="row">
        <div class="ico"><svg viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-9l-5 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></svg></div>
        <div><div class="k">Pesan</div><div class="v" id="t-pesan"></div></div>
      </div>
      <hr class="perf">
      <p class="foot"><span class="script">Main bareng aku yuk?</span><br><span class="kecil" id="t-dari"></span></p>
    </article>

    <div class="actions" id="actions"></div>
  </section>
</main>

<script>
(function () {
  // ====== UBAH BAGIAN INI ======
  var CONFIG = {
    pengirim: "WAHYU",        // nama yang mengajak
    penerima: "IDA",          // nama yang diajak
    tahun: 2026,
    bulan: 10,                // bulan tanggal yang bisa dipilih (10 = Oktober)
    dressCode: "Bebas",
    foto: "",                 // opsional: foto dalam bentuk data URI (data:image/jpeg;base64,...)
    waNomor: "",              // nomor WhatsApp pengirim, format 62812xxxxxxx (kosong = tanpa tombol WA)
  };
  // =============================

  var $ = function (id) { return document.getElementById(id); };
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var HARI = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
  var BULAN = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
  var PERIODE = [
    { k: "Pagi", t: "09:00" }, { k: "Siang", t: "12:00" },
    { k: "Sore", t: "15:00" }, { k: "Malam", t: "19:00" }
  ];
  var ACTS = [
    ["Makan Malam", "\uD83C\uDF7D\uFE0F"], ["Nonton Film", "\uD83C\uDFAC"], ["Jalan-Jalan", "\uD83D\uDEB6"], ["Main Game", "\uD83C\uDFAE"],
    ["Belanja", "\uD83D\uDECD\uFE0F"], ["Ngopi Bareng", "\u2615"], ["Piknik", "\uD83E\uDDFA"], ["Konser", "\uD83C\uDFA4"]
  ];
  var FLOWER_COLORS = ["#F7A8BD", "#F4B49C", "#9BA8F0", "#FFFFFF", "#F3C2DA", "#F6D2A0"];
  var SCREENS = ["s-envelope", "s-ask", "s-when", "s-what", "s-msg", "s-ticket"];

  var state = { day: 1, periode: "Sore", jam: "15:00", acara: [], pesan: "" };

  function show(id) {
    SCREENS.forEach(function (s) { $(s).hidden = (s !== id); });
    var h = $(id).querySelector("[data-focus]");
    if (h) h.focus({ preventScroll: true });
    window.scrollTo(0, 0);
  }

  function rand(a, b) { return a + Math.random() * (b - a); }

  // ---------- teks dari CONFIG ----------
  document.title = "Undangan buat " + CONFIG.penerima;
  $("env-for").textContent = "Ada undangan buat " + CONFIG.penerima;
  $("ask-from").textContent = "dari " + CONFIG.pengirim;
  $("when-for").textContent = "buat " + CONFIG.penerima;
  $("msg-title").textContent = "Ada pesan buat " + CONFIG.pengirim + "?";

  if (CONFIG.foto) {
    var img = document.createElement("img");
    img.src = CONFIG.foto;
    img.alt = "";
    $("foto").appendChild(img);
  } else {
    $("foto").innerHTML = '<svg aria-hidden="true"><use href="#heart"/></svg>';
  }

  // ---------- bunga ----------
  function flowerHTML(x, y, size, color, delay) {
    return '<svg class="fl" viewBox="-50 -50 100 100" style="left:' + x.toFixed(1) + 'px;top:' + y.toFixed(1) +
      'px;width:' + size.toFixed(1) + 'px;height:' + size.toFixed(1) + 'px;color:' + color +
      ';animation-delay:' + Math.round(delay) + 'ms;--r:' + Math.round(rand(-40, 40)) + 'deg" aria-hidden="true"><use href="#fl"/></svg>';
  }

  function bloomSequence() {
    var ov = $("bloom");
    ov.innerHTML = "";
    ov.className = "bloom on";
    var vw = window.innerWidth, vh = window.innerHeight;
    var k = Math.min(vw * 0.8, vh * 0.55) / 34;
    var N = 34, html = "";
    for (var i = 0; i < N; i++) {
      var t = (i / N) * Math.PI * 2;
      var hx = 16 * Math.pow(Math.sin(t), 3);
      var hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      html += flowerHTML(vw / 2 + hx * k, vh / 2 + (hy - 2.5) * k, Math.max(26, k * 5), FLOWER_COLORS[i % FLOWER_COLORS.length], i * 28);
    }
    ov.innerHTML = html;

    setTimeout(function () {
      ov.classList.add("cover");
      var cell = 84, cols = Math.ceil(vw / cell) + 1, rows = Math.ceil(vh / cell) + 1, extra = "";
      for (var r = 0; r < rows; r++) {
        for (var c = 0; c < cols; c++) {
          extra += flowerHTML((c + (r % 2 ? 0.5 : 0)) * cell + rand(-14, 14), r * cell + rand(-14, 14),
            cell * 1.9 + rand(0, 50), FLOWER_COLORS[(r + c + Math.floor(rand(0, 3))) % FLOWER_COLORS.length], rand(0, 500));
        }
      }
      ov.insertAdjacentHTML("beforeend", extra);
    }, 1300);
    setTimeout(function () { show("s-ask"); }, 2500);
    setTimeout(function () { ov.classList.add("out"); }, 2600);
    setTimeout(function () { ov.className = "bloom"; ov.innerHTML = ""; }, 3400);
  }

  function rain(count) {
    if (reduced) return;
    for (var i = 0; i < count; i++) {
      var el = document.createElement("div");
      var size = rand(22, 46);
      el.className = "fall";
      el.style.left = rand(0, 94) + "vw";
      el.style.width = size + "px";
      el.style.color = FLOWER_COLORS[i % FLOWER_COLORS.length];
      el.style.animationDuration = rand(3.5, 6.5) + "s";
      el.style.animationDelay = rand(0, 1.4) + "s";
      el.style.setProperty("--dx", rand(-50, 50) + "px");
      el.innerHTML = '<svg viewBox="-50 -50 100 100" aria-hidden="true"><use href="#fl"/></svg>';
      el.addEventListener("animationend", function (ev) { ev.currentTarget.remove(); });
      document.body.appendChild(el);
    }
  }

  // ---------- 1. amplop ----------
  var env = $("env"), opened = false;
  env.addEventListener("click", function () {
    if (opened) return;
    opened = true;
    env.classList.add("open");
    if (reduced) { setTimeout(function () { show("s-ask"); }, 400); return; }
    setTimeout(bloomSequence, 700);
  });

  // ---------- 2. ajakan: tombol Tidak tidak bisa diklik ----------
  var yes = $("yes"), no = $("no"), slot = $("slot"), hint = $("hint");
  var teases = [
    "Loh, tombolnya kabur. Coba lagi deh.",
    "Yakin nih? Tombol Iya udah nungguin dari tadi.",
    "Tombol Tidak-nya malu kayaknya.",
    "Kayaknya tombol Tidak-nya emang rusak deh.",
    "Udah, pencet Iya aja.",
    "Tuh, tombol Iya makin gede. Kasian kalau gak dipilih.",
    "Tombol Tidak udah capek kejar-kejaran."
  ];
  var tries = 0, cx = 0, cy = 0, lastDodge = 0, leaving = false;
  var pointer = { x: -999, y: -999 };

  function applyScale() {
    var sNo = Math.max(0.72, 1 - tries * 0.04);
    var sYes = Math.min(1.4, 1 + tries * 0.06);
    no.style.transform = "translate(" + cx + "px," + cy + "px) scale(" + sNo + ")";
    yes.style.transform = "scale(" + sYes + ")";
  }

  function dodge(force) {
    if (leaving) return;
    var now = performance.now();
    if (!force && now - lastDodge < 180) return;
    lastDodge = now;
    tries++;
    hint.textContent = teases[(tries - 1) % teases.length];

    var sNo = Math.max(0.72, 1 - tries * 0.04);
    var hw = no.offsetWidth * sNo / 2, hh = no.offsetHeight * sNo / 2;
    var m = 14, vw = window.innerWidth, vh = window.innerHeight;
    var s = slot.getBoundingClientRect();
    var ncx = s.left + s.width / 2, ncy = s.top + s.height / 2;
    var y = yes.getBoundingClientRect();

    var best = null, bestScore = -2;
    for (var i = 0; i < 40; i++) {
      var tx = m + hw + Math.random() * Math.max(1, vw - 2 * (m + hw));
      var ty = m + hh + Math.random() * Math.max(1, vh - 2 * (m + hh));
      var overlap = tx + hw > y.left - 16 && tx - hw < y.right + 16 && ty + hh > y.top - 16 && ty - hh < y.bottom + 16;
      var score = overlap ? -1 : Math.hypot(tx - pointer.x, ty - pointer.y);
      if (score > bestScore) { bestScore = score; best = { x: tx, y: ty }; }
      if (score > 180) break;
    }
    cx = best.x - ncx;
    cy = best.y - ncy;
    applyScale();
  }

  document.addEventListener("pointermove", function (e) {
    pointer = { x: e.clientX, y: e.clientY };
    if (e.pointerType !== "mouse" || leaving || $("s-ask").hidden) return;
    var r = no.getBoundingClientRect();
    var d = Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
    if (d < Math.max(r.width, r.height) / 2 + 70) dodge(false);
  });
  no.addEventListener("pointerdown", function (e) { e.preventDefault(); pointer = { x: e.clientX, y: e.clientY }; dodge(true); });
  no.addEventListener("touchstart", function (e) { e.preventDefault(); dodge(true); }, { passive: false });
  no.addEventListener("click", function (e) { e.preventDefault(); e.stopPropagation(); dodge(true); });
  no.addEventListener("focus", function () { dodge(true); yes.focus({ preventScroll: true }); });
  window.addEventListener("resize", function () { cx = 0; cy = 0; applyScale(); });

  yes.addEventListener("click", function () { leaving = true; show("s-when"); });

  // ---------- 3. kapan ----------
  var tgl = $("tgl"), jam = $("jam"), periodeBox = $("periode");
  var daysInMonth = new Date(CONFIG.tahun, CONFIG.bulan, 0).getDate();
  var defaultDay = 1;
  for (var d = 1; d <= daysInMonth; d++) {
    var dow = new Date(CONFIG.tahun, CONFIG.bulan - 1, d).getDay();
    var opt = document.createElement("option");
    opt.value = d;
    opt.textContent = HARI[dow] + ", " + d + " " + BULAN[CONFIG.bulan - 1] + " " + CONFIG.tahun;
    tgl.appendChild(opt);
    if (dow === 6 && defaultDay === 1) defaultDay = d;
  }
  tgl.value = defaultDay;

  function paintPeriode() {
    Array.prototype.forEach.call(periodeBox.children, function (b) {
      b.setAttribute("aria-checked", b.dataset.k === state.periode ? "true" : "false");
    });
  }
  PERIODE.forEach(function (p) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.setAttribute("role", "radio");
    b.dataset.k = p.k;
    b.textContent = p.k;
    b.addEventListener("click", function () {
      state.periode = p.k;
      jam.value = p.t;
      paintPeriode();
    });
    periodeBox.appendChild(b);
  });
  paintPeriode();
  jam.addEventListener("input", function () {
    var h = parseInt((jam.value || "15:00").split(":")[0], 10);
    state.periode = h < 11 ? "Pagi" : h < 15 ? "Siang" : h < 18 ? "Sore" : "Malam";
    paintPeriode();
  });
  $("when-next").addEventListener("click", function () {
    state.day = parseInt(tgl.value, 10);
    state.jam = jam.value || "15:00";
    show("s-what");
  });

  // ---------- 4. ngapain ----------
  var actsBox = $("acts"), whatNext = $("what-next");
  function refreshWhat() { whatNext.disabled = state.acara.length === 0; }
  function toggleAct(btn, name) {
    var i = state.acara.indexOf(name);
    if (i >= 0) { state.acara.splice(i, 1); btn.setAttribute("aria-pressed", "false"); }
    else { state.acara.push(name); btn.setAttribute("aria-pressed", "true"); }
    refreshWhat();
  }
  function addAct(name, emoji, pressed) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "act";
    b.setAttribute("aria-pressed", "false");
    var em = document.createElement("span");
    em.className = "em";
    em.setAttribute("aria-hidden", "true");
    em.textContent = emoji;
    var tx = document.createElement("span");
    tx.textContent = name;
    b.appendChild(em);
    b.appendChild(tx);
    b.addEventListener("click", function () { toggleAct(b, name); });
    actsBox.appendChild(b);
    if (pressed) toggleAct(b, name);
  }
  ACTS.forEach(function (a) { addAct(a[0], a[1], false); });
  function addOwn() {
    var v = $("own").value.trim();
    if (!v) return;
    addAct(v, "\u2728", true);
    $("own").value = "";
  }
  $("own-add").addEventListener("click", addOwn);
  $("own").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); addOwn(); } });
  whatNext.addEventListener("click", function () { show("s-msg"); });

  // ---------- 5. pesan + 6. tiket ----------
  function kapanText() {
    var dow = new Date(CONFIG.tahun, CONFIG.bulan - 1, state.day).getDay();
    return HARI[dow] + ", " + state.day + " " + BULAN[CONFIG.bulan - 1] + " " + CONFIG.tahun + " \u00B7 " + state.periode + " \u00B7 " + state.jam;
  }
  function ticketText() {
    return "\uD83D\uDC8C Tiket kencan\n" +
      "Untuk: " + CONFIG.pengirim + "\n" +
      "Dari: " + CONFIG.penerima + "\n" +
      "Kapan: " + kapanText() + "\n" +
      "Acara: " + $("t-acara").textContent + "\n" +
      "Dress code: " + CONFIG.dressCode + "\n" +
      "Pesan: " + $("t-pesan").textContent;
  }

  $("msg-next").addEventListener("click", function () {
    state.pesan = $("pesan").value.trim();
    $("t-untuk").textContent = CONFIG.pengirim;
    $("t-kapan").textContent = kapanText();
    $("t-acara").textContent = state.acara.join(", ");
    $("t-dress").textContent = CONFIG.dressCode;
    $("t-pesan").textContent = state.pesan || "Sampai ketemu nanti!";
    $("t-dari").textContent = "dari " + CONFIG.pengirim;

    var box = $("actions");
    box.innerHTML = "";
    if (CONFIG.waNomor) {
      var a = document.createElement("a");
      a.className = "btn";
      a.target = "_blank";
      a.rel = "noopener";
      a.href = "https://wa.me/" + encodeURIComponent(CONFIG.waNomor) + "?text=" + encodeURIComponent(ticketText());
      a.textContent = "Kirim ke " + CONFIG.pengirim + " via WhatsApp";
      box.appendChild(a);
    } else {
      var p = document.createElement("p");
      p.className = "small";
      p.textContent = "Screenshot tiketnya terus kirim ke " + CONFIG.pengirim + " ya.";
      box.appendChild(p);
    }
    var c = document.createElement("button");
    c.type = "button";
    c.className = "btn plain";
    c.textContent = "Salin detail tiket";
    c.addEventListener("click", function () {
      function fin(ok) { c.textContent = ok ? "Tersalin" : "Gagal disalin. Screenshot aja ya."; }
      try { navigator.clipboard.writeText(ticketText()).then(function () { fin(true); }, function () { fin(false); }); }
      catch (e) { fin(false); }
    });
    box.appendChild(c);

    show("s-ticket");
    rain(22);
  });
})();
</script>
</body>
</html>
